# Postiz para Docker Swarm (Portainer > Stacks > Add stack > Web editor)
# Baseado no compose oficial: github.com/gitroomhq/postiz-docker-compose
#
# ANTES de subir (passo a passo em infra/postiz/LEIA-ME.md):
#  1. Troque postiz.SEUDOMINIO.com.br pelo seu subdomínio (aponte o DNS para o servidor).
#  2. Troque TROCAR_* por senhas fortes (não reaproveite senhas).
#  3. Em Portainer > Configs, crie "postiz_temporal_dynamicconfig" com o conteúdo de
#     infra/postiz/development-sql.yaml.
#  4. Confira o nome da rede do Traefik (aqui: network_public) e do certresolver
#     (aqui: letsencryptresolver). Se o seu Traefik usa outros nomes, ajuste.

version: "3.8"

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    environment:
      MAIN_URL: "https://postiz.SEUDOMINIO.com.br"
      FRONTEND_URL: "https://postiz.SEUDOMINIO.com.br"
      NEXT_PUBLIC_BACKEND_URL: "https://postiz.SEUDOMINIO.com.br/api"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      JWT_SECRET: "TROCAR_JWT_texto_aleatorio_bem_longo"
      DATABASE_URL: "postgresql://postiz:TROCAR_SENHA_DB@postiz-postgres:5432/postiz"
      REDIS_URL: "redis://postiz-redis:6379"
      TEMPORAL_ADDRESS: "temporal:7233"
      IS_GENERAL: "true"
      # Depois de criar a sua conta, troque para "true" e atualize o stack
      DISABLE_REGISTRATION: "false"
      RUN_CRON: "true"
      API_LIMIT: 30

      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"

      # Instagram via app da Meta (o mesmo app que já usamos)
      FACEBOOK_APP_ID: "TROCAR_APP_ID"
      FACEBOOK_APP_SECRET: "TROCAR_APP_SECRET"

      NX_ADD_PLUGINS: "false"
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    networks:
      - postiz-network
      - network_public
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.postiz.rule=Host(`postiz.SEUDOMINIO.com.br`)
        - traefik.http.routers.postiz.entrypoints=websecure
        - traefik.http.routers.postiz.tls.certresolver=letsencryptresolver
        - traefik.http.services.postiz.loadbalancer.server.port=5000

  postiz-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: TROCAR_SENHA_DB
      POSTGRES_DB: postiz
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  postiz-redis:
    image: redis:7.2
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  # ---------- Temporal (fila de agendamento do Postiz, obrigatório desde a v2.12) ----------
  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  temporal-postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: TROCAR_SENHA_TEMPORAL
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=TROCAR_SENHA_TEMPORAL
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    configs:
      - source: postiz_temporal_dynamicconfig
        target: /etc/temporal/config/dynamicconfig/development-sql.yaml
    networks:
      - temporal-network
      - postiz-network
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 15s

volumes:
  postiz-config:
  postiz-uploads:
  postiz-postgres-data:
  postiz-redis-data:
  temporal-postgres-data:
  temporal-elasticsearch-data:

configs:
  postiz_temporal_dynamicconfig:
    external: true

networks:
  postiz-network:
    driver: overlay
  temporal-network:
    driver: overlay
  network_public:
    external: true
